<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neuer Einsatz</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--ink:#0d1117;--mute:#6b7280;--tile:#e4eefc;--tile2:#d6e6fb;--blue:#2b64e0;--green:#4aa63e;--red:#d13438;--card:#f3f6fb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141b;--ink:#f1f4f9;--mute:#9aa4b2;--tile:#1a2740;--tile2:#1f3050;--blue:#6e9bff;--card:#18202c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f141b;--ink:#f1f4f9;--mute:#9aa4b2;--tile:#1a2740;--tile2:#1f3050;--blue:#6e9bff;--card:#18202c;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:520px;margin:0 auto;padding:14px 16px 40px}
#clock{text-align:center;font-weight:800;font-size:18px}
h1{font-size:40px;font-weight:800;margin:14px 0 16px;letter-spacing:-.5px}
.tile{display:flex;align-items:center;gap:16px;width:100%;border:0;border-radius:22px;background:var(--tile);color:var(--ink);font:inherit;text-align:left;padding:18px 20px;cursor:pointer}
.tile:active{background:var(--tile2)}
.tile svg{width:40px;height:40px;flex:none;stroke:var(--blue);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tile b{font-size:21px;font-weight:800;display:block}
.tile small{color:var(--mute);font-size:17px}
#kunde{display:block;width:100%;border:0;background:transparent;color:var(--ink);font:inherit;font-size:17px;padding:0;outline:none}
#kunde::placeholder{color:var(--mute)}
.hero{flex-direction:column;justify-content:center;text-align:center;min-height:190px;margin:14px 0;gap:6px}
.hero svg{width:56px;height:56px;fill:var(--blue);stroke:none}
.hero b{font-size:32px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid .tile{padding:18px 14px;min-height:76px;border-radius:20px}
.grid .tile b{font-size:18px}
.grid .tile.on{outline:3px solid var(--blue)}
.big{display:block;width:100%;border:0;border-radius:20px;color:#fff;font:inherit;font-size:30px;font-weight:800;padding:20px;margin-top:14px;cursor:pointer}
.big[disabled]{opacity:.45}
#start{background:var(--green);margin-top:22px}#ende{background:var(--red);margin-top:12px}
h2{font-size:22px;margin:30px 0 10px}
.log{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.log li{background:var(--card);border-radius:16px;padding:12px 14px}
.log .h{display:flex;justify-content:space-between;gap:8px;font-weight:800}
.log .h span{color:var(--mute);font-weight:600}
.log p{margin:6px 0 0;line-height:1.4;white-space:pre-wrap}
.log audio{width:100%;margin-top:8px;height:36px}
.log button{border:0;background:none;color:var(--mute);font:inherit;cursor:pointer;padding:0}
.empty{color:var(--mute)}
dialog{border:0;border-radius:26px 26px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));width:100%;max-width:520px;margin:auto auto 0;background:var(--bg);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{margin:0 0 12px;font-size:24px}
#mic{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;border-radius:18px;background:var(--blue);color:#fff;font:inherit;font-size:20px;font-weight:800;padding:16px;cursor:pointer}
#mic.rec{background:var(--red)}
#mic.rec::before{content:"";width:12px;height:12px;border-radius:50%;background:#fff;animation:p 1s infinite}
@keyframes p{50%{opacity:.2}}
@media (prefers-reduced-motion:reduce){#mic.rec::before{animation:none}}
textarea,input[type=number]{width:100%;margin-top:12px;border:2px solid var(--tile2);border-radius:14px;background:var(--card);color:var(--ink);font:inherit;font-size:18px;padding:12px}
textarea{min-height:120px;resize:vertical}
#prev{width:100%;margin-top:10px}
.row{display:flex;gap:10px;margin-top:14px}
.row button{flex:1;border:0;border-radius:14px;font:inherit;font-size:18px;font-weight:800;padding:14px;cursor:pointer}
#save{background:var(--green);color:#fff}#cancel{background:var(--tile);color:var(--ink)}
#hint{color:var(--mute);font-size:14px;margin:8px 0 0}
#status{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}#status div{background:var(--card);border-radius:14px;padding:8px 6px;text-align:center;font-size:13px;color:var(--mute)}#status b{display:block;font-size:19px;color:var(--ink);font-variant-numeric:tabular-nums}#status .run b{color:var(--green)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
</style>
</head>
<body>
<main>
<div id="clock"></div>
<h1>Neuer Einsatz</h1>
<div id="status"></div>

<button class="tile" data-t="kunde">
  <svg viewBox="0 0 48 48"><path d="M8 34h32v4H8zM11 34c0-9 5-16 13-16s13 7 13 16M24 12v6M18 14l2 5M30 14l-2 5"/></svg>
  <span style="flex:1"><b>Kunde / Baustelle</b><small id="kunde">Name oder Adresse eingeben</small></span>
</button>

<button class="tile hero" data-t="tat">
  <svg viewBox="0 0 48 48"><rect x="17" y="3" width="14" height="25" rx="7"/><path d="M10 22a14 14 0 0 0 28 0" fill="none" stroke="currentColor" style="stroke:var(--blue)" stroke-width="3.5" stroke-linecap="round"/><rect x="21" y="36" width="6" height="7"/><rect x="15" y="42" width="18" height="3" rx="1.5"/></svg>
  <b>Tätigkeit</b><small>Was hast du gemacht?</small>
</button>

<div class="grid">
  <button class="tile" data-t="mat"><svg viewBox="0 0 48 48"><rect x="15" y="4" width="14" height="14" rx="2"/><rect x="4" y="22" width="18" height="18" rx="3"/><rect x="26" y="22" width="18" height="18" rx="3"/></svg><b>Material</b></button>
  <button class="tile" id="pause"><svg viewBox="0 0 48 48"><path d="M8 24h28v6a10 10 0 0 1-10 10h-8A10 10 0 0 1 8 30zM36 26h2a4 4 0 0 1 0 8h-3M16 6c2 2-2 4 0 7M24 6c2 2-2 4 0 7M32 6c2 2-2 4 0 7"/></svg><b>Pause</b></button>
  <button class="tile" data-t="not"><svg viewBox="0 0 48 48"><path d="M32 8H12a3 3 0 0 0-3 3v28a3 3 0 0 0 3 3h20a3 3 0 0 0 3-3V30M15 17h12M15 24h10M15 31h6M40 12l-14 14-2 6 6-2 14-14z"/></svg><b>Notiz</b></button>
  <button class="tile" data-t="km"><svg viewBox="0 0 48 48" style="fill:var(--blue)"><path d="M10 18l3-8h22l3 8a4 4 0 0 1 4 4v12a2 2 0 0 1-2 2h-3a3 3 0 0 1-6 0H17a3 3 0 0 1-6 0H8a2 2 0 0 1-2-2V22a4 4 0 0 1 4-4zm5.5-5l-2 5h21l-2-5z" stroke="none"/></svg><b>Anfahrt km</b></button>
  <button class="tile" id="fahrt"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="19"/><path d="M20 15l14 9-14 9z" fill="var(--blue)"/></svg><b>Fahrt starten</b></button>
  <button class="tile" id="ankunft"><svg viewBox="0 0 48 48"><path d="M10 44V6M10 8c8-4 14 4 22 0v18c-8 4-14-4-22 0"/><path d="M18 9v8M26 13v8M18 17h8" /></svg><b>Ankunft</b></button>
  <button class="tile" data-t="wun" style="grid-column:1/-1"><svg viewBox="0 0 48 48"><path d="M6 10h36v24H20l-9 8v-8H6z"/><path d="M14 18h20M14 26h12"/></svg><span><b>Kundenwunsch</b><small>Einsprechen, z. B. „2 Steckdosen“</small></span></button>
</div>

<button class="big" id="start">Start</button>
<button class="big" id="ende" disabled>Ende</button>

<h2>Protokoll</h2>
<ul class="log" id="log"></ul>
<p class="empty" id="empty">Noch keine Einträge. Tippe auf Start oder eine Kachel.</p>
</main>

<dialog id="dlg">
  <h3 id="dt"></h3>
  <button id="mic" type="button">Aufnahme starten</button>
  <p id="hint"></p>
  <textarea id="txt" placeholder="Text erscheint hier, du kannst ihn auch tippen oder korrigieren"></textarea>
  <input id="km" type="number" inputmode="decimal" min="0" step="0.1" placeholder="Kilometer" hidden>
  <audio id="prev" controls hidden></audio>
  <div class="row"><button id="cancel" type="button">Abbrechen</button><button id="save" type="button">Speichern</button></div>
</dialog>

<script>
const L={tat:"Tätigkeit",mat:"Material",not:"Notiz",km:"Anfahrt km",wun:"Kundenwunsch",pause:"Pause",fahrt:"Fahrt gestartet",fahrtende:"Fahrt beendet",kunde:"Kunde / Baustelle",ankunft:"Ankunft",start:"Einsatz gestartet",ende:"Einsatz beendet"};
const VOICE=["tat","mat","not","wun","kunde"];
const $=id=>document.getElementById(id);
let S={kunde:"",start:null,end:null,pause:false,items:[]};
let cur=null,mr=null,stream=null,sr=null,chunks=[],blob=null,recording=false,base="";

/* storage (IndexedDB, falls verfügbar) */
let db=null;
function open(){return new Promise(r=>{try{const q=indexedDB.open("einsatz",1);q.onupgradeneeded=()=>q.result.createObjectStore("s");q.onsuccess=()=>{db=q.result;r()};q.onerror=()=>r()}catch(e){r()}})}
function load(){return new Promise(r=>{if(!db)return r();try{const g=db.transaction("s").objectStore("s").get("cur");g.onsuccess=()=>{if(g.result)S=g.result;r()};g.onerror=()=>r()}catch(e){r()}})}
function save(){try{db&&db.transaction("s","readwrite").objectStore("s").put(S,"cur")}catch(e){}}

/* Uhr */
const tick=()=>{const d=new Date();$("clock").textContent=d.toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"})+" · "+d.toLocaleTimeString("de-DE")};
setInterval(()=>{tick();status()},1000);tick();
const hm=t=>new Date(t).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});

/* Zeiten laufen über Zeitstempel weiter, auch wenn die Seite geschlossen ist */
const now=()=>Date.now();
const fmt=ms=>{ms=Math.max(0,Math.floor(ms/1000));const h=Math.floor(ms/3600),m=Math.floor(ms%3600/60),s=ms%60;return [h,m,s].map(n=>String(n).padStart(2,"0")).join(":")};
function status(){
  const t=now(),box=$("status");
  const e=S.start?(S.end||t)-S.start:0;
  const p=(S.pauseTotal||0)+(S.pauseSince?t-S.pauseSince:0);
  const f=(S.fahrtTotal||0)+(S.fahrtSince?t-S.fahrtSince:0);
  box.textContent="";
  [["Einsatz",e,S.start&&!S.end],["Fahrt",f,!!S.fahrtSince],["Pause",p,!!S.pauseSince]].forEach(([n,v,r])=>{const d=document.createElement("div");if(r)d.className="run";d.textContent=n;const b=document.createElement("b");b.textContent=fmt(v);d.appendChild(b);box.appendChild(d)});
}
/* Protokoll */
function render(){
  const ul=$("log");ul.textContent="";
  [...S.items].reverse().forEach(it=>{
    const li=document.createElement("li");
    const h=document.createElement("div");h.className="h";
    const a=document.createElement("div");a.textContent=L[it.type]+(it.type==="km"&&it.km!=null?": "+it.km+" km":"");
    const b=document.createElement("span");b.textContent=hm(it.ts)+" ";
    const x=document.createElement("button");x.textContent="Löschen";x.onclick=()=>{S.items=S.items.filter(i=>i!==it);save();render()};
    b.appendChild(x);h.append(a,b);li.appendChild(h);
    if(it.text){const p=document.createElement("p");p.textContent=it.text;li.appendChild(p)}
    if(it.audio){const au=document.createElement("audio");au.controls=true;au.src=URL.createObjectURL(it.audio);li.appendChild(au)}
    ul.appendChild(li);
  });
  $("empty").hidden=S.items.length>0;
  $("kunde").textContent=S.kunde||"Name oder Adresse eingeben";
  $("start").disabled=!!S.start&&!S.end;
  $("ende").disabled=!S.start||!!S.end;
  $("pause").classList.toggle("on",S.pause);
  $("pause").querySelector("b").textContent=S.pause?"Pause beenden":"Pause";
  $("fahrt").classList.toggle("on",!!S.fahrtSince);
  $("fahrt").querySelector("b").textContent=S.fahrtSince?"Fahrt beenden":"Fahrt starten";
  status();
}
function add(type,extra){S.items.push(Object.assign({type,ts:Date.now()},extra||{}));save();render()}


function stopPause(){if(S.pauseSince){S.pauseTotal=(S.pauseTotal||0)+now()-S.pauseSince;S.pauseSince=null}S.pause=false}
function stopFahrt(){if(S.fahrtSince){S.fahrtTotal=(S.fahrtTotal||0)+now()-S.fahrtSince;S.fahrtSince=null}}
$("start").onclick=()=>{S={kunde:S.kunde,start:now(),end:null,pause:false,pauseSince:null,pauseTotal:0,fahrtSince:null,fahrtTotal:0,items:S.end?[]:S.items};add("start")};
$("ende").onclick=()=>{stopPause();stopFahrt();S.end=now();add("ende")};
$("pause").onclick=()=>{if(S.pause){stopPause();add("pause",{text:"Pause beendet"})}else{S.pause=true;S.pauseSince=now();add("pause",{text:"Pause begonnen"})}};
$("fahrt").onclick=()=>{if(S.fahrtSince){stopFahrt();add("fahrtende")}else{S.fahrtSince=now();add("fahrt")}};
$("ankunft").onclick=()=>{stopFahrt();add("ankunft")};

/* Sheet mit Spracheingabe */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const IOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const AUTO=!!SR;

document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>openSheet(b.dataset.t));
function openSheet(t){
  cur=t;blob=null;chunks=[];
  $("dt").textContent=L[t];$("txt").value=t==="kunde"?(S.kunde||""):"";$("km").value="";$("prev").hidden=true;$("prev").removeAttribute("src");
  const v=VOICE.includes(t);
  $("mic").hidden=!v;$("km").hidden=t!=="km";$("hint").hidden=!v;
  $("txt").placeholder=t==="km"?"Notiz (optional)":"Text erscheint hier, du kannst ihn auch tippen oder korrigieren";
  $("hint").textContent=AUTO?"Sprich los: Die Aufnahme wird als Audio gespeichert und in Text umgewandelt.":"Auf dem iPhone geht beides nicht gleichzeitig. Nimm Audio auf, oder tippe ins Feld und diktiere den Text mit dem Mikrofon auf deiner Tastatur.";
  $("dlg").showModal();
}
function setMic(r){recording=r;$("mic").classList.toggle("rec",r);$("mic").textContent=r?"Aufnahme beenden":(blob?"Nochmal aufnehmen":"Aufnahme starten")}
async function startRec(){
  try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){$("hint").textContent="Kein Mikrofon-Zugriff ("+(e&&e.name||"Fehler")+"). Erlaube das Mikrofon in den iPhone-Einstellungen für deinen Browser, oder diktiere den Text mit der Mikrofon-Taste der Tastatur.";return}
  chunks=[];blob=null;base=$("txt").value?$("txt").value.trim()+" ":"";
  try{mr=new MediaRecorder(stream)}catch(err){stream.getTracks().forEach(t=>t.stop());$("hint").textContent="Audioaufnahme wird hier nicht unterstützt. Tippe ins Feld und diktiere mit der Mikrofon-Taste der Tastatur.";return}
  mr.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  mr.onstop=()=>{blob=new Blob(chunks,{type:mr.mimeType||"audio/webm"});$("prev").src=URL.createObjectURL(blob);$("prev").hidden=false;stream.getTracks().forEach(t=>t.stop());setMic(false)};
  mr.start();
  if(AUTO){
    sr=new SR();sr.lang="de-DE";sr.continuous=true;sr.interimResults=true;
    let fin="";
    sr.onresult=e=>{let tmp="";for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)fin+=r[0].transcript+" ";else tmp+=r[0].transcript}$("txt").value=(base+fin+tmp).trim()};
    sr.onerror=e=>{if(e.error!=="no-speech"&&e.error!=="aborted"){sr.dead=true;$("hint").textContent="Text-Umwandlung nicht möglich ("+e.error+"). Das Audio wird weiter aufgenommen. Tipp: Mikrofon-Taste der Tastatur zum Diktieren."}};
    sr.onend=()=>{if(recording&&!sr.dead){try{sr.start()}catch(e){}}};
    try{sr.start()}catch(e){}
  }
  setMic(true);
}
function stopRec(){recording=false;try{sr&&sr.stop()}catch(e){}try{mr&&mr.state!=="inactive"&&mr.stop()}catch(e){}}
$("mic").onclick=()=>recording?stopRec():startRec();
$("cancel").onclick=()=>{stopRec();$("dlg").close()};
$("save").onclick=()=>{
  stopRec();
  setTimeout(()=>{
    const text=$("txt").value.trim();
    if(cur==="km"){const k=parseFloat($("km").value.replace(",","."));if(isNaN(k))return $("km").focus();add("km",{km:k,text})}
    else if(cur==="kunde"){if(!text)return;S.kunde=text;save();render()}else{if(!text&&!blob)return;add(cur,{text,audio:blob})}
    $("dlg").close();
  },250);
};

open().then(load).then(render);
</script>
</body>
</html>
